name: Demo en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:release
      - run: npm run build:demo
      - run: node scripts/verify-build.mjs
      - run: node nexupav1.0.0/verify.mjs
      - name: Comprobar fuentes del paquete separado
        working-directory: nexupav1.0.0/source
        run: |
          node ../../node_modules/typescript/bin/tsc --noEmit --incremental false
          node ../../node_modules/vite/bin/vite.js build --config vite.demo.config.ts --outDir ../../.local/release-source-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar demo
        id: deployment
        uses: actions/deploy-pages@v4
